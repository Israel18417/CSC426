<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <gradientTransform>rotate(45)</gradientTransform>
            <stop offset="0%" stop-color="#0a0f1d" />
            <stop offset="100%" stop-color="#07090e" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
    </defs>
    
    <!-- Background shape (smooth squircle) -->
    <rect width="32" height="32" rx="9" fill="url(#bgGrad)"/>
    <rect width="30" height="30" x="1" y="1" rx="8" fill="none" stroke="url(#emeraldGrad)" stroke-width="1" opacity="0.3"/>
    
    <!-- Outer Triangle Icon -->
    <path d="M16 6L6 24h20L16 6z" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Exclamation mark (Alert status) -->
    <path d="M16 11v5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="16" cy="20" r="1.2" fill="#ffffff"/>
</svg>
