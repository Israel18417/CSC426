<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1d" />
            <stop offset="100%" stop-color="#07090e" />
        </linearGradient>
        <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
    </defs>
    
    <!-- Background shape (smooth squircle) -->
    <rect width="32" height="32" rx="9" fill="url(#bgGrad)"/>
    <rect width="30" height="30" x="1" y="1" rx="8" fill="none" stroke="url(#emeraldGrad)" stroke-width="1" opacity="0.35"/>
    
    <!-- Code Brackets Icon </ > representing Computer Science -->
    <!-- Left Bracket < -->
    <path d="M11 10L5 16l6 6" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <path d="M18 8l-4 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right Bracket > -->
    <path d="M21 10l6 6-6 6" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
